<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Filiado | PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans antialiased h-screen overflow-hidden">

    <div id="app" class="h-full w-full">
        <div class="flex flex-col items-center justify-center h-full">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-cyan-500 mb-4"></div>
            <p class="text-slate-400 text-lg font-medium tracking-wide">Iniciando sistema...</p>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        const SUPABASE_URL = 'https://pcbhozlfjbtozglzlols.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_7dNwLnpNrBvw9ZDcfsxvsA_fgye91ay';

        let supabase;
        let session = null;
        let clientes = [];
        
        let currentTab = 'dashboard';
        let isModalOpen = false;
        let editandoId = null;
        
        const hoje = new Date();
        let filtroMes = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}`;

        async function init() {
            try {
                supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { data, error } = await supabase.auth.getSession();
                if (error) throw error;
                
                session = data?.session || null;

                supabase.auth.onAuthStateChange((_event, _session) => {
                    session = _session;
                    window.render();
                    if (session) window.buscarClientes();
                });

                window.render();
                if (session) window.buscarClientes();
            } catch (err) {
                document.getElementById('app').innerHTML = `<div class="p-8 text-red-500 font-bold">Erro: ${err.message}</div>`;
            }
        }

        window.buscarClientes = async function() {
            try {
                const { data, error } = await supabase.from('clientes').select('*').order('data_vencimento', { ascending: true });
                if (!error) {
                    clientes = data || [];
                    window.render();
                }
            } catch (err) {
                console.error(err);
            }
        };

        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert('Erro ao entrar: ' + error.message);
        };

        window.handleLogout = async function() {
            await supabase.auth.signOut();
        };

        window.mudarAba = function(aba) {
            currentTab = aba;
            window.render();
        };

        window.mudarFiltro = function(valor) {
            filtroMes = valor;
            window.render();
        };

        window.abrirModal = function(id = null) {
            editandoId = id;
            isModalOpen = true;
            window.render();
        };

        window.fecharModal = function() {
            editandoId = null;
            isModalOpen = false;
            window.render();
        };

        window.salvarCliente = async function(e) {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const valor_mensal = parseFloat(document.getElementById('valor_mensal').value);
            const valor_filiado = parseFloat(document.getElementById('valor_filiado').value);
            const data_vencimento = document.getElementById('data_vencimento').value;

            if (editandoId) {
                await supabase.from('clientes').update({ nome, whatsapp, valor_mensal, valor_filiado, data_vencimento }).eq('id', editandoId);
            } else {
                await supabase.from('clientes').insert([{ nome, whatsapp, valor_mensal, valor_filiado, data_vencimento, status: 'ativo' }]);
            }
            window.fecharModal();
            window.buscarClientes();
        };

        window.deletarCliente = async function(id) {
            if (confirm('Deseja excluir este cliente?')) {
                await supabase.from('clientes').delete().eq('id', id);
                window.buscarClientes();
            }
        };

        window.renovarCliente = async function(id, dataAtualStr) {
            const dataAtual = new Date(dataAtualStr);
            dataAtual.setDate(dataAtual.getDate() + 30);
            const novaData = dataAtual.toISOString().split('T')[0];

            await supabase.from('clientes').update({ data_vencimento: novaData, status: 'ativo' }).eq('id', id);
            window.buscarClientes();
        };

        window.render = function() {
            const app = document.getElementById('app');

            if (!session) {
                app.innerHTML = `
                    <div class="flex items-center justify-center h-full bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                        <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl p-8 rounded-2xl shadow-[0_0_50px_rgba(6,182,212,0.15)] border border-slate-700 relative overflow-hidden">
                            <div class="absolute -top-10 -right-10 w-32 h-32 bg-cyan-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
                            
                            <h2 class="text-3xl font-black mb-8 text-white text-center tracking-wide">
                                PAINEL FILIADO <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">PRO</span>
                            </h2>
                            
                            <form onsubmit="window.handleLogin(event)" class="space-y-5 relative z-10">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">E-mail</label>
                                    <input type="email" id="email" required class="w-full p-3 bg-slate-950 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-cyan-500 outline-none transition-all">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Senha</label>
                                    <input type="password" id="password" required class="w-full p-3 bg-slate-950 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-cyan-500 outline-none transition-all">
                                </div>
                                <button type="submit" class="w-full mt-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 text-white p-3 rounded-lg font-bold tracking-wide transition-all shadow-[0_0_15px_rgba(6,182,212,0.4)]">
                                    ACESSAR PAINEL
                                </button>
                            </form>
                        </div>
                    </div>
                `;
                return;
            }

            const clientesFiltrados = clientes.filter(c => c.data_vencimento.startsWith(filtroMes) && c.status === 'ativo');
            const totalBruto = clientesFiltrados.reduce((acc, c) => acc + Number(c.valor_mensal || 0), 0);
            const totalFiliado = clientesFiltrados.reduce((acc, c) => acc + Number(c.valor_filiado || 0), 0);
            const cliEdicao = editandoId ? clientes.find(c => c.id === editandoId) : null;

            app.innerHTML = `
                <div class="flex h-full">
                    <!-- SIDEBAR LATERAL -->
                    <aside class="w-20 md:w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between flex-shrink-0 z-10 shadow-2xl">
                        <div>
                            <div class="p-6 hidden md:block">
                                <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-wider">MENU</h1>
                            </div>
                            <div class="p-4 md:hidden flex justify-center">
                                <div class="w-10 h-10 bg-gradient-to-r from-cyan-500 to-blue-500 rounded-xl flex items-center justify-center font-black text-white">PRO</div>
                            </div>
                            
                            <nav class="mt-4 px-2 space-y-2">
                                <button onclick="window.mudarAba('dashboard')" class="${currentTab === 'dashboard' ? 'bg-slate-800 text-cyan-400 border-l-4 border-cyan-500' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 border-l-4 border-transparent'} w-full flex items-center gap-4 px-4 py-3 rounded-r-lg transition-all font-bold group">
                                    <svg class="w-5 h-5 flex-shrink-0 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                    <span class="hidden md:block">Dashboard</span>
                                </button>
                                
                                <button onclick="window.mudarAba('clientes')" class="${currentTab === 'clientes' ? 'bg-slate-800 text-cyan-400 border-l-4 border-cyan-500' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 border-l-4 border-transparent'} w-full flex items-center gap-4 px-4 py-3 rounded-r-lg transition-all font-bold group">
                                    <svg class="w-5 h-5 flex-shrink-0 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                    <span class="hidden md:block">Clientes</span>
                                </button>
                            </nav>
                        </div>
                        
                        <div class="p-4 border-t border-slate-800">
                            <button onclick="window.handleLogout()" class="w-full flex items-center justify-center md:justify-start gap-3 px-2 py-2 text-slate-500 hover:text-red-400 font-bold transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                                <span class="hidden md:block">Sair do Painel</span>
                            </button>
                        </div>
                    </aside>

                    <!-- CONTEÚDO PRINCIPAL -->
                    <main class="flex-1 overflow-y-auto bg-slate-950 p-4 md:p-10 relative">
                        <div class="fixed top-0 left-1/4 w-96 h-96 bg-cyan-600/10 rounded-full mix-blend-screen filter blur-[100px] pointer-events-none"></div>

                        ${currentTab === 'dashboard' ? `
                            <!-- TELA DASHBOARD -->
                            <div class="max-w-6xl mx-auto">
                                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
                                    <div>
                                        <h2 class="text-3xl md:text-4xl font-black text-white tracking-wide">Visão Geral</h2>
                                        <p class="text-slate-400 mt-1">Acompanhe seus resultados e faturamentos</p>
                                    </div>
                                    
                                    <div class="bg-slate-800/80 backdrop-blur-md rounded-xl p-1.5 border border-slate-700 flex items-center shadow-lg">
                                        <span class="px-3 text-slate-400 text-xs font-bold uppercase tracking-wider">Referência:</span>
                                        <input type="month" value="${filtroMes}" onchange="window.mudarFiltro(this.value)" class="bg-slate-900/50 text-cyan-400 font-bold border border-slate-700/50 rounded-lg p-2 outline-none focus:ring-1 focus:ring-cyan-500 [color-scheme:dark] cursor-pointer">
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                                    <div class="bg-gradient-to-br from-slate-800 to-slate-900 p-6 rounded-2xl border border-slate-700/50 shadow-xl relative overflow-hidden group">
                                        <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:scale-110 transition-transform"><svg class="w-16 h-16 text-cyan-500" fill="currentColor" viewBox="0 0 20 20"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"></path></svg></div>
                                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 relative z-10">Clientes no Mês</h3>
                                        <p class="text-4xl font-black text-white relative z-10">${clientesFiltrados.length} <span class="text-sm text-slate-500 font-normal">ativos</span></p>
                                    </div>
                                    
                                    <div class="bg-gradient-to-br from-slate-800 to-slate-900 p-6 rounded-2xl border border-slate-700/50 shadow-xl relative overflow-hidden group">
                                        <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:scale-110 transition-transform"><svg class="w-16 h-16 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg></div>
                                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 relative z-10">Faturamento Bruto Total</h3>
                                        <p class="text-4xl font-black text-white relative z-10">
                                            <span class="text-xl text-slate-500">R$</span> ${totalBruto.toFixed(2)}
                                        </p>
                                    </div>

                                    <div class="bg-gradient-to-br from-cyan-900/40 to-blue-900/40 p-6 rounded-2xl border border-cyan-500/30 shadow-[0_0_30px_rgba(6,182,212,0.1)] relative overflow-hidden">
                                        <div class="absolute top-0 left-0 w-1 h-full bg-cyan-500 shadow-[0_0_15px_#06b6d4]"></div>
                                        <h3 class="text-xs font-bold text-cyan-400 uppercase tracking-widest mb-2">Valor Total do Filiado</h3>
                                        <p class="text-4xl font-black text-white">
                                            <span class="text-xl text-cyan-600">R$</span> ${totalFiliado.toFixed(2)}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        ` : `
                            <!-- TELA CLIENTES -->
                            <div class="max-w-6xl mx-auto h-full flex flex-col">
                                <div class="flex justify-between items-center mb-8">
                                    <div>
                                        <h2 class="text-3xl md:text-4xl font-black text-white tracking-wide">Base de Clientes</h2>
                                        <p class="text-slate-400 mt-1">Gerencie suas assinaturas</p>
                                    </div>
                                    
                                    <button onclick="window.abrirModal()" class="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white rounded-full shadow-[0_0_20px_rgba(6,182,212,0.5)] transition-all flex items-center justify-center w-14 h-14 md:w-auto md:px-6 md:py-3 md:rounded-xl group">
                                        <svg class="w-8 h-8 md:w-5 md:h-5 md:mr-2 group-hover:rotate-90 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
                                        <span class="hidden md:block font-bold tracking-wide">NOVO CLIENTE</span>
                                    </button>
                                </div>

                                <div class="bg-slate-800/80 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700 flex-1 overflow-hidden flex flex-col">
                                    <div class="overflow-x-auto flex-1">
                                        <table class="w-full text-left border-collapse whitespace-nowrap">
                                            <thead class="bg-slate-900/80 border-b border-slate-700 sticky top-0 z-10 backdrop-blur-md">
                                                <tr>
                                                    <th class="p-5 text-xs font-bold text-slate-400 uppercase tracking-wider">Cliente</th>
                                                    <th class="p-5 text-xs font-bold text-slate-400 uppercase tracking-wider">WhatsApp</th>
                                                    <th class="p-5 text-xs font-bold text-slate-400 uppercase tracking-wider">Valor Total</th>
                                                    <th class="p-5 text-xs font-bold text-slate-400 uppercase tracking-wider">Valor Filiado</th>
                                                    <th class="p-5 text-xs font-bold text-slate-400 uppercase tracking-wider">Vencimento</th>
                                                    <th class="p-5 text-xs font-bold text-slate-400 uppercase tracking-wider text-right">Ações</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-slate-700/50">
                                                ${clientes.length === 0 ? `<tr><td colspan="6" class="p-10 text-center text-slate-500 font-medium">Nenhum cliente cadastrado. Clique no botão + para adicionar.</td></tr>` : ''}
                                                ${clientes.map(c => `
                                                    <tr class="hover:bg-slate-700/30 transition-colors group">
                                                        <td class="p-5">
                                                            <div class="font-bold text-slate-200 text-base">${c.nome}</div>
                                                            <div class="text-xs text-slate-500 mt-1 flex items-center gap-1">
                                                                <span class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_5px_#22c55e]"></span> Ativo
                                                            </div>
                                                        </td>
                                                        <td class="p-5 text-slate-300">${c.whatsapp || '-'}</td>
                                                        <td class="p-5 text-slate-300 font-medium">
                                                            <span class="text-slate-500 text-xs">R$</span> ${Number(c.valor_mensal || 0).toFixed(2)}
                                                        </td>
                                                        <td class="p-5 text-cyan-400 font-bold">
                                                            <span class="text-slate-500 text-xs font-normal">R$</span> ${Number(c.valor_filiado || 0).toFixed(2)}
                                                        </td>
                                                        <td class="p-5">
                                                            <span class="bg-slate-900 border border-slate-600 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-lg">
                                                                ${c.data_vencimento.split('-').reverse().join('/')}
                                                            </span>
                                                        </td>
                                                        <td class="p-5 flex justify-end space-x-2">
                                                            <button onclick="window.renovarCliente('${c.id}', '${c.data_vencimento}')" title="Renovar +30 dias" class="bg-slate-800 hover:bg-green-600/20 text-slate-400 hover:text-green-400 border border-slate-700 hover:border-green-500/50 p-2.5 rounded-xl transition-all">
                                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                                            </button>
                                                            <button onclick="window.abrirModal('${c.id}')" title="Editar" class="bg-slate-800 hover:bg-yellow-600/20 text-slate-400 hover:text-yellow-400 border border-slate-700 hover:border-yellow-500/50 p-2.5 rounded-xl transition-all">
                                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                                            </button>
                                                            <button onclick="window.deletarCliente('${c.id}')" title="Deletar" class="bg-slate-800 hover:bg-red-600/20 text-slate-400 hover:text-red-400 border border-slate-700 hover:border-red-500/50 p-2.5 rounded-xl transition-all">
                                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                `).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        `}
                    </main>
                </div>

                <!-- MODAL DE CADASTRO / EDIÇÃO -->
                ${isModalOpen ? `
                    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-[fadeIn_0.2s_ease-out]">
                        <div class="bg-slate-800 w-full max-w-lg rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.5)] border border-slate-700 relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 to-blue-500"></div>
                            
                            <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                                <h3 class="text-xl font-black text-white tracking-wide">${editandoId ? 'EDITAR ASSINANTE' : 'NOVO ASSINANTE'}</h3>
                                <button onclick="window.fecharModal()" class="text-slate-400 hover:text-white bg-slate-900 p-2 rounded-lg transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </div>
                            
                            <form onsubmit="window.salvarCliente(event)" class="p-6 space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Nome Completo</label>
                                    <input type="text" id="nome" required value="${cliEdicao ? cliEdicao.nome : ''}" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-cyan-500 outline-none transition-all placeholder-slate-600" placeholder="Ex: João da Silva">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">WhatsApp</label>
                                    <input type="text" id="whatsapp" value="${cliEdicao ? cliEdicao.whatsapp || '' : ''}" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-cyan-500 outline-none transition-all placeholder-slate-600" placeholder="(00) 00000-0000">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Valor Total (R$)</label>
                                        <input type="number" step="0.01" id="valor_mensal" required value="${cliEdicao ? cliEdicao.valor_mensal : ''}" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white font-bold focus:ring-2 focus:ring-cyan-500 outline-none transition-all" placeholder="50.00">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-cyan-400 uppercase tracking-wider mb-1">Valor Filiado (R$)</label>
                                        <input type="number" step="0.01" id="valor_filiado" required value="${cliEdicao ? cliEdicao.valor_filiado : ''}" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-cyan-400 font-bold focus:ring-2 focus:ring-cyan-500 outline-none transition-all" placeholder="35.00">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Data de Vencimento</label>
                                    <input type="date" id="data_vencimento" required value="${cliEdicao ? cliEdicao.data_vencimento : ''}" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-cyan-500 outline-none transition-all [color-scheme:dark] cursor-pointer">
                                </div>
                                
                                <div class="pt-3 flex gap-3">
                                    <button type="button" onclick="window.fecharModal()" class="flex-1 bg-slate-900 text-slate-300 hover:text-white p-3 rounded-xl font-bold transition-all border border-slate-700 hover:border-slate-500">
                                        CANCELAR
                                    </button>
                                    <button type="submit" class="flex-1 bg-gradient-to-r ${editandoId ? 'from-yellow-600 to-orange-600 hover:from-yellow-500' : 'from-cyan-600 to-blue-600 hover:from-cyan-500'} text-white p-3 rounded-xl font-bold tracking-wide transition-all shadow-md">
                                        ${editandoId ? 'SALVAR' : 'CADASTRAR'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                ` : ''}
            `;
        };

        const style = document.createElement('style');
        style.innerHTML = `@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }`;
        document.head.appendChild(style);

        init();
    </script>
</body>
</html>

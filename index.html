<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel do Filiado | PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        .tech-grid {
            background-image: linear-gradient(to right, rgba(15, 23, 42, 0.4) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(15, 23, 42, 0.4) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased h-screen overflow-hidden select-none">

    <div id="app" class="h-full w-full">
        <div class="flex flex-col items-center justify-center h-full bg-slate-950">
            <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-cyan-500 mb-3"></div>
            <p class="text-slate-400 text-sm font-medium">Carregando sistema...</p>
        </div>
    </div>

    <!-- Container do Modal Isolado -->
    <div id="modal-container"></div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        const SUPABASE_URL = 'https://pcbhozlfjbtozglzlols.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_7dNwLnpNrBvw9ZDcfsxvsA_fgye91ay';

        let supabase;
        let session = null;
        let clientes = [];
        
        let currentTab = 'dashboard';
        let isModalOpen = false;
        let editandoId = null;
        let termoBusca = '';
        
        let formData = {
            nome: '',
            whatsapp: '',
            valor_mensal: '',
            valor_filiado: '',
            data_vencimento: ''
        };

        const hoje = new Date();
        let filtroMes = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}`;

        async function init() {
            try {
                supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { data, error } = await supabase.auth.getSession();
                if (error) throw error;
                
                session = data?.session || null;

                supabase.auth.onAuthStateChange((_event, _session) => {
                    session = _session;
                    window.render();
                    if (session) window.buscarClientes();
                });

                window.render();
                if (session) window.buscarClientes();
            } catch (err) {
                document.getElementById('app').innerHTML = `<div class="p-8 text-red-500 font-bold">Erro: ${err.message}</div>`;
            }
        }

        window.buscarClientes = async function() {
            try {
                const { data, error } = await supabase.from('clientes').select('*').order('data_vencimento', { ascending: true });
                if (!error) {
                    clientes = data || [];
                    window.render();
                }
            } catch (err) {
                console.error(err);
            }
        };

        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) alert('Erro ao entrar: ' + error.message);
        };

        window.handleLogout = async function() {
            await supabase.auth.signOut();
        };

        window.mudarAba = function(aba) {
            currentTab = aba;
            window.render();
        };

        window.mudarFiltro = function(valor) {
            filtroMes = valor;
            window.render();
        };

        window.atualizarBusca = function(valor) {
            termoBusca = valor.toLowerCase();
            window.render();
        };

        window.abrirModal = function(id = null) {
            editandoId = id;
            if (id) {
                const c = clientes.find(item => item.id === id);
                if (c) {
                    formData = {
                        nome: c.nome || '',
                        whatsapp: c.whatsapp || '',
                        valor_mensal: c.valor_mensal || '',
                        valor_filiado: c.valor_filiado || '',
                        data_vencimento: c.data_vencimento || ''
                    };
                }
            } else {
                formData = { nome: '', whatsapp: '', valor_mensal: '', valor_filiado: '', data_vencimento: '' };
            }
            isModalOpen = true;
            window.renderModal();
        };

        window.fecharModal = function() {
            editandoId = null;
            isModalOpen = false;
            window.renderModal();
        };

        function vincularInputsModal() {
            ['nome', 'whatsapp', 'valor_mensal', 'valor_filiado', 'data_vencimento'].forEach(campo => {
                const el = document.getElementById(campo);
                if (el) {
                    el.value = formData[campo];
                    el.addEventListener('input', (e) => {
                        formData[campo] = e.target.value;
                    });
                }
            });
        }

        window.salvarCliente = async function(e) {
            e.preventDefault();

            if (editandoId) {
                await supabase.from('clientes').update({ 
                    nome: formData.nome, 
                    whatsapp: formData.whatsapp, 
                    valor_mensal: parseFloat(formData.valor_mensal), 
                    valor_filiado: parseFloat(formData.valor_filiado), 
                    data_vencimento: formData.data_vencimento 
                }).eq('id', editandoId);
            } else {
                await supabase.from('clientes').insert([{ 
                    nome: formData.nome, 
                    whatsapp: formData.whatsapp, 
                    valor_mensal: parseFloat(formData.valor_mensal), 
                    valor_filiado: parseFloat(formData.valor_filiado), 
                    data_vencimento: formData.data_vencimento, 
                    status: 'ativo' 
                }]);
            }
            window.fecharModal();
            window.buscarClientes();
        };

        window.deletarCliente = async function(id) {
            if (confirm('Deseja excluir este cliente?')) {
                await supabase.from('clientes').delete().eq('id', id);
                window.buscarClientes();
            }
        };

        window.renovarCliente = async function(id, dataAtualStr) {
            const dataAtual = new Date(dataAtualStr + 'T00:00:00');
            dataAtual.setDate(dataAtual.getDate() + 30);
            const novaData = dataAtual.toISOString().split('T')[0];

            await supabase.from('clientes').update({ data_vencimento: novaData, status: 'ativo' }).eq('id', id);
            window.buscarClientes();
        };

        window.renderModal = function() {
            const modalContainer = document.getElementById('modal-container');
            if (!isModalOpen) {
                modalContainer.innerHTML = '';
                return;
            }
            if (document.getElementById('modal-box')) return;

            modalContainer.innerHTML = `
                <div id="modal-box" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
                    <div class="bg-slate-900 w-full max-w-lg rounded-3xl shadow-2xl border border-slate-800 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 to-blue-600"></div>
                        
                        <div class="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-950/40">
                            <h3 class="text-base font-black text-white tracking-wide">${editandoId ? 'EDITAR ASSINANTE' : 'NOVO ASSINANTE'}</h3>
                            <button onclick="window.fecharModal()" class="text-slate-400 hover:text-white bg-slate-800 p-2 rounded-xl">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        
                        <form onsubmit="window.salvarCliente(event)" class="p-5 space-y-3.5">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Nome Completo</label>
                                <input type="text" id="nome" required class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs md:text-sm focus:border-cyan-500 outline-none" placeholder="Ex: João da Silva">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">WhatsApp</label>
                                <input type="text" id="whatsapp" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs md:text-sm focus:border-cyan-500 outline-none" placeholder="(00) 00000-0000">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Valor Total (R$)</label>
                                    <input type="number" step="0.01" id="valor_mensal" required class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs md:text-sm font-bold focus:border-cyan-500 outline-none" placeholder="50.00">
                                </div>
                                <div>
                                    <label class="block text-[11px] font-bold text-cyan-400 uppercase tracking-wider mb-1">Valor Filiado (R$)</label>
                                    <input type="number" step="0.01" id="valor_filiado" required class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-cyan-400 text-xs md:text-sm font-bold focus:border-cyan-500 outline-none" placeholder="35.00">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Data de Vencimento</label>
                                <input type="date" id="data_vencimento" required class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-white text-xs md:text-sm focus:border-cyan-500 outline-none [color-scheme:dark]">
                            </div>
                            
                            <div class="pt-2 flex gap-3">
                                <button type="button" onclick="window.fecharModal()" class="flex-1 bg-slate-950 text-slate-300 p-3 rounded-xl text-xs md:text-sm font-bold border border-slate-800">
                                    CANCELAR
                                </button>
                                <button type="submit" class="flex-1 bg-gradient-to-r ${editandoId ? 'from-yellow-600 to-orange-600' : 'from-cyan-600 to-blue-600'} text-white p-3 rounded-xl text-xs md:text-sm font-bold tracking-wide shadow-md">
                                    ${editandoId ? 'SALVAR' : 'CADASTRAR'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            vincularInputsModal();
        };

        window.render = function() {
            const app = document.getElementById('app');

            if (!session) {
                app.innerHTML = `
                    <div class="flex items-center justify-center h-full bg-slate-950 tech-grid relative overflow-hidden p-4">
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-cyan-500/10 rounded-full blur-[100px] pointer-events-none"></div>

                        <div class="w-full max-w-md bg-slate-900/95 backdrop-blur-2xl p-6 sm:p-8 rounded-3xl shadow-2xl border border-slate-800 relative z-10">
                            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 to-blue-600"></div>
                            
                            <div class="text-center mb-6">
                                <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 mb-3 shadow-lg">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0115.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
                                </div>
                                <h2 class="text-2xl font-black text-white tracking-wider">AUTOLOG <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">PRO</span></h2>
                                <p class="text-[11px] text-slate-500 uppercase tracking-widest mt-1">Portal de Gestão de Filiados</p>
                            </div>
                            
                            <form onsubmit="window.handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">E-mail</label>
                                    <input type="email" id="email" required class="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:border-cyan-500 outline-none text-sm" placeholder="admin@autolog.com">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">Senha</label>
                                    <input type="password" id="password" required class="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-white focus:border-cyan-500 outline-none text-sm" placeholder="••••••••">
                                </div>
                                <button type="submit" class="w-full mt-2 bg-gradient-to-r from-cyan-600 to-blue-600 text-white p-3.5 rounded-xl font-bold tracking-wide shadow-lg active:scale-95 transition-transform">
                                    ENTRAR NO SISTEMA
                                </button>
                            </form>
                        </div>
                    </div>
                `;
                return;
            }

            const clientesFiltradosMes = clientes.filter(c => c.data_vencimento.startsWith(filtroMes) && c.status === 'ativo');
            const totalBruto = clientesFiltradosMes.reduce((acc, c) => acc + Number(c.valor_mensal || 0), 0);
            const totalFiliado = clientesFiltradosMes.reduce((acc, c) => acc + Number(c.valor_filiado || 0), 0);
            const clientesBusca = clientes.filter(c => c.nome.toLowerCase().includes(termoBusca) || (c.whatsapp && c.whatsapp.includes(termoBusca)));

            app.innerHTML = `
                <div class="flex flex-col md:flex-row h-full tech-grid pb-16 md:pb-0">
                    <!-- SIDEBAR COM MENU NO TOPO -->
                    <aside class="order-2 md:order-1 w-full md:w-64 bg-slate-900 border-t md:border-t-0 md:border-r border-slate-800 flex md:flex-col justify-between flex-shrink-0 z-20 shadow-2xl fixed md:static bottom-0 left-0">
                        <div class="w-full">
                            <div class="hidden md:block p-6 pb-4">
                                <h1 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-wider">AUTOLOG PRO</h1>
                                <span class="text-[10px] text-slate-500 uppercase tracking-widest">Painel do Filiado</span>
                            </div>
                            
                            <!-- MENU POSICIONADO NO TOPO LOGO ABAIXO DO LOGO -->
                            <nav class="flex md:flex-col w-full px-2 py-2 md:px-3 md:py-0 md:space-y-1.5 justify-around md:justify-start">
                                <button onclick="window.mudarAba('dashboard')" class="${currentTab === 'dashboard' ? 'bg-slate-800 text-cyan-400 md:border-l-4 border-cyan-500' : 'text-slate-400 hover:text-slate-200'} flex-1 md:flex-none flex flex-col md:flex-row items-center gap-1.5 md:gap-3.5 p-2.5 md:px-4 md:py-3 md:rounded-xl transition-all font-bold group">
                                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                    <span class="text-[11px] md:text-sm">Dashboard</span>
                                </button>
                                
                                <button onclick="window.mudarAba('clientes')" class="${currentTab === 'clientes' ? 'bg-slate-800 text-cyan-400 md:border-l-4 border-cyan-500' : 'text-slate-400 hover:text-slate-200'} flex-1 md:flex-none flex flex-col md:flex-row items-center gap-1.5 md:gap-3.5 p-2.5 md:px-4 md:py-3 md:rounded-xl transition-all font-bold group">
                                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                    <span class="text-[11px] md:text-sm">Clientes</span>
                                </button>

                                <button onclick="window.handleLogout()" class="flex-1 md:hidden flex flex-col items-center gap-1.5 p-2.5 text-slate-400 hover:text-red-400 font-bold">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                                    <span class="text-[11px]">Sair</span>
                                </button>
                            </nav>
                        </div>
                        
                        <div class="hidden md:block p-4 border-t border-slate-800">
                            <button onclick="window.handleLogout()" class="w-full flex items-center gap-3 px-2 py-2 text-slate-500 hover:text-red-400 font-bold text-sm transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                                <span>Sair</span>
                            </button>
                        </div>
                    </aside>

                    <!-- CONTEÚDO PRINCIPAL -->
                    <main class="order-1 md:order-2 flex-1 overflow-y-auto bg-slate-950/60 p-4 md:p-10 relative">
                        ${currentTab === 'dashboard' ? `
                            <div class="max-w-6xl mx-auto">
                                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 md:mb-10 gap-4">
                                    <div>
                                        <h2 class="text-2xl md:text-3xl font-black text-white tracking-wide">Visão Geral</h2>
                                        <p class="text-slate-400 text-xs md:text-sm mt-0.5">Resultados consolidados por período</p>
                                    </div>
                                    
                                    <div class="bg-slate-900 rounded-xl p-1.5 border border-slate-800 flex items-center shadow-lg w-full sm:w-auto justify-between sm:justify-start">
                                        <span class="px-3 text-slate-400 text-xs font-bold uppercase">Mês:</span>
                                        <input type="month" value="${filtroMes}" onchange="window.mudarFiltro(this.value)" class="bg-slate-950 text-cyan-400 font-bold border border-slate-800 rounded-lg p-2 text-xs md:text-sm outline-none [color-scheme:dark] cursor-pointer">
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 md:gap-6 mb-10">
                                    <div class="bg-slate-900 p-5 md:p-6 rounded-2xl border border-slate-800 shadow-xl relative overflow-hidden">
                                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Assinantes no Mês</h3>
                                        <p class="text-3xl md:text-4xl font-black text-white">${clientesFiltradosMes.length} <span class="text-xs text-slate-500 font-normal">ativos</span></p>
                                    </div>
                                    
                                    <div class="bg-slate-900 p-5 md:p-6 rounded-2xl border border-slate-800 shadow-xl relative overflow-hidden">
                                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Faturamento Bruto</h3>
                                        <p class="text-3xl md:text-4xl font-black text-white">
                                            <span class="text-lg text-slate-500">R$</span> ${totalBruto.toFixed(2)}
                                        </p>
                                    </div>

                                    <div class="bg-gradient-to-br from-cyan-950/40 to-slate-900 p-5 md:p-6 rounded-2xl border border-cyan-500/30 shadow-lg relative overflow-hidden">
                                        <h3 class="text-xs font-bold text-cyan-400 uppercase tracking-widest mb-2">Total a Repassar</h3>
                                        <p class="text-3xl md:text-4xl font-black text-white">
                                            <span class="text-lg text-cyan-600">R$</span> ${totalFiliado.toFixed(2)}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        ` : `
                            <div class="max-w-6xl mx-auto h-full flex flex-col">
                                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                    <div>
                                        <h2 class="text-2xl md:text-3xl font-black text-white tracking-wide">Clientes</h2>
                                        <p class="text-slate-400 text-xs md:text-sm mt-0.5">Gerenciamento de assinaturas</p>
                                    </div>
                                    
                                    <div class="flex items-center gap-2 w-full sm:w-auto">
                                        <div class="relative flex-1 sm:w-60">
                                            <input type="text" value="${termoBusca}" oninput="window.atualizarBusca(this.value)" placeholder="Buscar cliente..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs md:text-sm text-white placeholder-slate-500 focus:border-cyan-500 outline-none">
                                        </div>

                                        <button onclick="window.abrirModal()" class="bg-gradient-to-r from-cyan-600 to-blue-600 text-white rounded-xl shadow-md p-2.5 sm:px-4 sm:py-2.5 flex items-center justify-center flex-shrink-0">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
                                            <span class="hidden sm:inline ml-1.5 font-bold text-xs uppercase">Novo</span>
                                        </button>
                                    </div>
                                </div>

                                <div class="bg-slate-900 rounded-2xl shadow-xl border border-slate-800 flex-1 overflow-hidden flex flex-col mb-4">
                                    <div class="overflow-x-auto flex-1">
                                        <table class="w-full text-left border-collapse whitespace-nowrap text-xs md:text-sm">
                                            <thead class="bg-slate-950 border-b border-slate-800 sticky top-0 z-10">
                                                <tr>
                                                    <th class="p-3.5 md:p-4 font-bold text-slate-400 uppercase">Cliente</th>
                                                    <th class="p-3.5 md:p-4 font-bold text-slate-400 uppercase">WhatsApp</th>
                                                    <th class="p-3.5 md:p-4 font-bold text-slate-400 uppercase">Total</th>
                                                    <th class="p-3.5 md:p-4 font-bold text-slate-400 uppercase">Filiado</th>
                                                    <th class="p-3.5 md:p-4 font-bold text-slate-400 uppercase">Vencimento</th>
                                                    <th class="p-3.5 md:p-4 font-bold text-slate-400 uppercase text-right">Ações</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-slate-800">
                                                ${clientesBusca.length === 0 ? `<tr><td colspan="6" class="p-8 text-center text-slate-500">Nenhum cliente encontrado.</td></tr>` : ''}
                                                ${clientesBusca.map(c => {
                                                    const hojeStr = new Date().toISOString().split('T')[0];
                                                    const vencido = c.data_vencimento < hojeStr;
                                                    return `
                                                        <tr class="hover:bg-slate-800/40 transition-colors">
                                                            <td class="p-3.5 md:p-4">
                                                                <div class="font-bold text-slate-200">${c.nome}</div>
                                                                <div class="text-[10px] text-slate-500 mt-0.5 flex items-center gap-1">
                                                                    <span class="w-1.5 h-1.5 rounded-full ${vencido ? 'bg-red-500' : 'bg-green-500'}"></span> 
                                                                    ${vencido ? 'Vencido' : 'Ativo'}
                                                                </div>
                                                            </td>
                                                            <td class="p-3.5 md:p-4 text-slate-300">${c.whatsapp || '-'}</td>
                                                            <td class="p-3.5 md:p-4 text-slate-300 font-medium">R$ ${Number(c.valor_mensal || 0).toFixed(2)}</td>
                                                            <td class="p-3.5 md:p-4 text-cyan-400 font-bold">R$ ${Number(c.valor_filiado || 0).toFixed(2)}</td>
                                                            <td class="p-3.5 md:p-4">
                                                                <span class="bg-slate-950 border ${vencido ? 'border-red-500/50 text-red-400' : 'border-slate-800 text-slate-300'} text-[11px] font-bold px-2.5 py-1 rounded-lg">
                                                                    ${c.data_vencimento.split('-').reverse().join('/')}
                                                                </span>
                                                            </td>
                                                            <td class="p-3.5 md:p-4 flex justify-end space-x-1.5">
                                                                <button onclick="window.renovarCliente('${c.id}', '${c.data_vencimento}')" title="Renovar" class="bg-slate-800 hover:bg-green-600/20 text-slate-400 hover:text-green-400 p-2 rounded-lg">
                                                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                                                </button>
                                                                <button onclick="window.abrirModal('${c.id}')" title="Editar" class="bg-slate-800 hover:bg-yellow-600/20 text-slate-400 hover:text-yellow-400 p-2 rounded-lg">
                                                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                                                </button>
                                                                <button onclick="window.deletarCliente('${c.id}')" title="Deletar" class="bg-slate-800 hover:bg-red-600/20 text-slate-400 hover:text-red-400 p-2 rounded-lg">
                                                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    `;
                                                }).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        `}
                    </main>
                </div>
            `;
        };

        const style = document.createElement('style');
        style.innerHTML = `@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }`;
        document.head.appendChild(style);

        init();
    </script>
</body>
</html>
